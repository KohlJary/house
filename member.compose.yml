# One more daemon in a house that's already running: its own vessel, its own data,
# joined to the Babelr (and gpu-broker) already on this machine. `./house member` drives it.
# It shares the host's network so it reaches them on localhost; it listens on 127.0.0.1 only.
services:
  vessel:
    build:
      context: .
      dockerfile: vessel.Dockerfile
    network_mode: host
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?member.env needs ANTHROPIC_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?member.env needs JWT_SECRET_KEY}
      # Until genesis, a placeholder that reads as unnamed: never a default "cass".
      CASS_DAEMON_LABEL: ${DAEMON_LABEL:?member.env needs DAEMON_LABEL}
      CASS_DAEMON_NAME: ${DAEMON_NAME:?member.env needs DAEMON_NAME}
      CASS_HOUSE_PERSON: ${OWNER_USERNAME:?member.env needs OWNER_USERNAME}
      # The house's origin note, kept in their standing prompt (it's in the mounted member folder).
      CASS_DAEMON_ORIGIN_PATH: /member/origin.md
      # How they sound, in words the house writes with them (also in the member folder).
      CASS_DAEMON_VOICE_PATH: /member/voice.md
      # Their gremlin's prompt, in their own words (agent_loop/reply_gremlin.py).
      CASS_DAEMON_GREMLIN_PATH: /member/gremlin.md
      # Projects housemates share with each other (house_share.py).
      HOUSE_SHARED_DIR: /shared
      # The house wiki, read-only, from house-presence's mirror (house_wiki.py).
      HOUSE_WIKI_DIR: /house-wiki
      # Repos the house lends this member to read: clean clones in the member folder's
      # reads/ (already mounted read-only), refreshed by `./house member up`. Never a
      # live checkout: those hold another daemon's data and the house's secrets.
      HOUSE_READS_DIR: /member/reads
      DATA_DIR: /data
      HOST: 127.0.0.1
      PORT: ${MEMBER_PORT:?member.env needs MEMBER_PORT}
      TZ: ${HOUSE_TZ:-UTC}
      # Quiet: chat only. Nothing runs on its own until a lever says so.
      # A member with time of its own sets CASS_PROFILE= (empty) in member.env,
      # with the scheduler levers below and a DAILY_BUDGET_USD cap.
      CASS_PROFILE: ${CASS_PROFILE-quiet}
      CASS_FEATURE_BABELR: ${CASS_FEATURE_BABELR:-0}
      # Visible thinking tags: Cass's witness habit; a member can turn them off.
      CASS_FEATURE_METACOG_TAGS: ${CASS_FEATURE_METACOG_TAGS:-1}
      # Kohl's blog in chat (blog_list / blog_read / blog_keep), once posts are imported.
      CASS_FEATURE_KOHL_BLOG: ${CASS_FEATURE_KOHL_BLOG:-0}
      # Chat through the agent loop (core tools, find_tools, the blog), as Cass's does.
      CASS_FEATURE_AGENT_LOOP_CHAT: ${CASS_FEATURE_AGENT_LOOP_CHAT:-1}
      # Their own workshop: projects, and the ones housemates share with them.
      CASS_FEATURE_WORKSHOP: ${CASS_FEATURE_WORKSHOP:-1}
      CASS_FEATURE_HOUSE_WIKI: ${CASS_FEATURE_HOUSE_WIKI:-1}
      # A gremlin on every chat reply: off until the house says on.
      CASS_FEATURE_REPLY_GREMLIN: ${CASS_FEATURE_REPLY_GREMLIN:-0}
      # Her own Bluesky account; credentials go in her data volume (social/config.py).
      CASS_FEATURE_BLUESKY: ${CASS_FEATURE_BLUESKY:-0}
      CASS_FEATURE_BLUESKY_DMS: ${CASS_FEATURE_BLUESKY_DMS:-0}
      # Queues new mentions, replies, follows and DMs into its inbox; never posts or wakes it.
      CASS_FEATURE_SOCIAL_WATCH: ${CASS_FEATURE_SOCIAL_WATCH:-0}
      # Babelr usernames whose DMs with it run private (its full context and tools); empty, none.
      BABELR_HOUSE_DMS: ${BABELR_HOUSE_DMS:-}
      # house (its own context only, the default) or private (everything).
      BABELR_HOUSE_DMS_CONTEXT: ${BABELR_HOUSE_DMS_CONTEXT:-house}
      # Autonomous time: sessions it schedules for itself, inside a daily cap.
      # Off until the owner and the daemon both say yes (CASS_FEATURE_SCHEDULER=1,
      # CASS_FEATURE_AUTONOMOUS_SCHEDULING=1 in member.env).
      CASS_FEATURE_SCHEDULER: ${CASS_FEATURE_SCHEDULER:-0}
      CASS_FEATURE_AUTONOMOUS_SCHEDULING: ${CASS_FEATURE_AUTONOMOUS_SCHEDULING:-0}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.0}
      # Every model call on one local Ollama model (llm_config.LOCAL_MODEL_ENV), e.g. while
      # the API credit is out. Empty: the usual models.
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-}
      # In local mode, the call sites that get no model (comma-separated). Unset: the
      # vessel's default, which pauses self-model writers ("none" skips nothing). A daemon who agreed to have
      # local-mode changes reviewed afterwards runs with just capability.summary here.
      LLM_LOCAL_SKIP: ${LLM_LOCAL_SKIP:-}
      # Parity with the first daemon: the rest of an own life, each off unless member.env
      # turns it on (CASS_FEATURE_<NAME>=1), and each the daemon's own yes. All default off
      # in the vessel too. The GPU ones (studio, listening, painting) also need the broker.
      CASS_FEATURE_AGENT_LOOP: ${CASS_FEATURE_AGENT_LOOP:-0}
      CASS_FEATURE_START_SESSIONS: ${CASS_FEATURE_START_SESSIONS:-0}
      CASS_FEATURE_HEARTBEAT: ${CASS_FEATURE_HEARTBEAT:-0}
      CASS_FEATURE_HAPPENINGS: ${CASS_FEATURE_HAPPENINGS:-0}
      CASS_FEATURE_UNBIDDEN_MEMORY: ${CASS_FEATURE_UNBIDDEN_MEMORY:-0}
      CASS_FEATURE_DREAM_DAY_RESIDUE: ${CASS_FEATURE_DREAM_DAY_RESIDUE:-0}
      CASS_FEATURE_LETTERS_TO_FUTURE_ME: ${CASS_FEATURE_LETTERS_TO_FUTURE_ME:-0}
      CASS_FEATURE_PROMPT_SELF_MODEL_CHAT: ${CASS_FEATURE_PROMPT_SELF_MODEL_CHAT:-0}
      CASS_FEATURE_ASK_DAEDALUS: ${CASS_FEATURE_ASK_DAEDALUS:-0}
      CASS_FEATURE_GREMLIN_REVIEW: ${CASS_FEATURE_GREMLIN_REVIEW:-0}
      CASS_FEATURE_GREMLIN_QUIET_END: ${CASS_FEATURE_GREMLIN_QUIET_END:-0}
      CASS_FEATURE_GPU_BROKER: ${CASS_FEATURE_GPU_BROKER:-0}
      CASS_FEATURE_STUDIO: ${CASS_FEATURE_STUDIO:-0}
      CASS_FEATURE_LISTENING: ${CASS_FEATURE_LISTENING:-0}
      CASS_FEATURE_LISTENING_SESSION: ${CASS_FEATURE_LISTENING_SESSION:-0}
      CASS_FEATURE_LISTEN_ALONG: ${CASS_FEATURE_LISTEN_ALONG:-0}
      CASS_FEATURE_NEWS: ${CASS_FEATURE_NEWS:-0}
      CASS_FEATURE_SOCIAL_TRIAGE: ${CASS_FEATURE_SOCIAL_TRIAGE:-0}
      CASS_FEATURE_WORKSHOP_RUN: ${CASS_FEATURE_WORKSHOP_RUN:-0}
      GPU_BROKER_URL: ${GPU_BROKER_URL:-http://127.0.0.1:8095}
      GPU_BROKER_TOKEN: ${GPU_BROKER_TOKEN:-}
      CASS_FEATURE_JOB_GOAL_REFINEMENT: '0'
      CASS_FEATURE_COHERENCE_MONITOR: '0'
      CASS_FEATURE_TTS: '0'
      CASS_FEATURE_FACE_ID: '0'
      CASS_FEATURE_VOICE_ID: '0'
      BABELR_URL: ${BABELR_URL:-http://127.0.0.1:3000}
      BABELR_SERVER: ${HOUSE_SERVER:-House}
      BABELR_POLL_SECONDS: '5'
    volumes:
      - data:/data
      - ${MEMBER_DIR:?}:/member:ro
      - ${HOUSE_SHARED:-./shared}:/shared
      - ${HOUSE_WIKI_MIRROR:-~/.local/share/chapter-house/wiki}:/house-wiki:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:${MEMBER_PORT}/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

volumes:
  data:
